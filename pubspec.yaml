name: free_lib_app
description: "FreeLib — Scan barcodes, build your personal book library."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Barcode scanning (ML Kit based)
  mobile_scanner: ^7.4.0

  # Database (SQLite)
  sqflite: ^2.4.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # State management
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.6.0

  # HTTP client
  dio: ^5.7.0

  # Image caching
  cached_network_image: ^3.4.0

  # Permissions
  permission_handler: ^11.3.0

  # UI components
  flutter_rating_bar: ^4.0.1
  google_fonts: ^6.2.0
  intl: ^0.19.0
  share_plus: ^13.3.0
  fl_chart: ^0.70.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.0
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icon.png"
