name: free_lib_app
description: "FreeLib — Szkennelj vonalkódokat, és építsd fel a saját könyvtáradat."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Vonalkód-olvasás (ML Kit alapú)
  mobile_scanner: ^7.4.0

  # Helyi adatbázis (SQLite)
  sqflite: ^2.4.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # Állapotkezelés (Riverpod)
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.6.0

  # HTTP kliens hálózati kérésekhez
  dio: ^5.7.0

  # Borítóképek gyorsítótárazása
  cached_network_image: ^3.4.0

  # Eszköz-jogosultságok kezelése
  permission_handler: ^11.3.0

  # Felhasználói felület elemek és diagramok
  flutter_rating_bar: ^4.0.1
  google_fonts: ^6.2.0
  intl: ^0.19.0
  share_plus: ^13.3.0
  fl_chart: ^0.70.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.0
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/icon.png

# Alkalmazás- és APK-ikon generálási beállítások (hagyományos + Android 8+ adaptív ikonok)
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "icon.png"
